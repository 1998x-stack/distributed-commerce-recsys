name: commerce-macos
services:
  # Existing V1.3 volumes may be root-owned; fix ownership before running the
  # API as uid 10001. This one-shot job must finish before API startup.
  volume-init:
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes: ["commerce_data:/data"]
    restart: "no"
  api:
    depends_on:
      volume-init: {condition: service_completed_successfully}
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      SQLITE_PATH: /app/data/commerce.db
      DATABASE_URL_POSTGRES: ${DATABASE_URL_POSTGRES:-}
      OPENSEARCH_URL: http://${UBUNTU_A_IP:?Set UBUNTU_A_IP}:9200
      GORSE_URL: http://${UBUNTU_B_IP:?Set UBUNTU_B_IP}:8087
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      ADMIN_KEY: ${ADMIN_KEY:?Set ADMIN_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
      APP_ENV: production
      GORSE_API_KEY: ${GORSE_API_KEY:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-120}
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes: ["commerce_data:/app/data"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      options: {max-size: "10m", max-file: "3"}
  sync:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    environment:
      API_URL: http://api:8000
      ADMIN_KEY: ${ADMIN_KEY:?Set ADMIN_KEY}
    command: ["python", "/app/scripts/sync_gorse.py"]
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      options: {max-size: "10m", max-file: "3"}
  storefront:
    build:
      context: ../..
      dockerfile: apps/storefront/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["${MAC_IP:?Set MAC_IP}:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      options: {max-size: "10m", max-file: "3"}
volumes:
  commerce_data: {}
